<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"></stop>
      <stop offset="100%" stop-color="#22c55e"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="180" height="180" rx="20" fill="#0f172a"></rect>

  <!-- Border -->
  <rect x="10" y="10" width="180" height="180" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="3"></rect>

  <!-- KA Text -->
  <text x="50%" y="54%" text-anchor="middle" fill="#ffffff" font-size="88" font-family="Inter, system-ui, Arial, sans-serif" font-weight="900" letter-spacing="6" dominant-baseline="middle">
    KA
  </text>

</svg>